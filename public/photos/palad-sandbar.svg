<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Palad Sandbar off Maniwaya Island">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b4f7a"/>
      <stop offset="55%" stop-color="#2c8ec4"/>
      <stop offset="100%" stop-color="#bfe7f5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062c4d"/>
      <stop offset="55%" stop-color="#0a5b82"/>
      <stop offset="100%" stop-color="#0f768c"/>
    </linearGradient>
    <radialGradient id="reef" cx="52%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#3fe0d0" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#14b8b8" stop-opacity="0.72"/>
      <stop offset="82%" stop-color="#0a5f82" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#062c4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fbf3dc"/>
      <stop offset="55%" stop-color="#f2dfb3"/>
      <stop offset="100%" stop-color="#dec18a"/>
    </linearGradient>
    <linearGradient id="islandHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7d46"/>
      <stop offset="100%" stop-color="#15472a"/>
    </linearGradient>
  </defs>

  <!-- Tropical morning sky -->
  <rect width="800" height="170" fill="url(#sky)"/>
  <!-- Soft high clouds -->
  <path d="M70 84 Q120 62 175 78 Q220 56 270 78 Q315 68 355 88 L45 88 Z" fill="#ffffff" fill-opacity="0.28"/>
  <path d="M510 68 Q565 44 630 62 Q680 48 730 72 L495 72 Z" fill="#ffffff" fill-opacity="0.24"/>

  <!-- Distant Maniwaya Island silhouette on horizon -->
  <path d="M0 170 L0 148 Q75 126 155 138 Q225 148 295 162 L335 170 Z" fill="url(#islandHills)" opacity="0.88"/>
  <path d="M565 170 Q630 144 705 148 Q760 151 800 158 L800 170 Z" fill="url(#islandHills)" opacity="0.72"/>

  <!-- Deep blue sea to coral lagoon -->
  <rect y="168" width="800" height="282" fill="url(#sea)"/>
  <ellipse cx="415" cy="300" rx="355" ry="125" fill="url(#reef)"/>

  <!-- Subtle bathymetric tide rings -->
  <ellipse cx="420" cy="302" rx="288" ry="86" fill="none" stroke="#9df3ea" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="10 8"/>
  <ellipse cx="422" cy="302" rx="232" ry="62" fill="none" stroke="#d5fcf7" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Translucent wet-sand halo -->
  <path d="M160 322 C230 274, 345 258, 455 264 C568 270, 646 286, 672 308 C640 330, 520 342, 412 340 C295 338, 198 340, 160 322 Z" fill="#7be5da" fill-opacity="0.48"/>

  <!-- Emerging crescent white sandbar -->
  <path d="M188 318 C255 280, 355 268, 458 274 C554 279, 622 292, 642 306 C608 320, 502 329, 405 327 C305 325, 224 328, 188 318 Z" fill="url(#sand)"/>
  <!-- Sunlit sandbar crest highlight -->
  <path d="M235 307 C295 285, 378 278, 462 283 C532 287, 582 296, 602 304 C555 310, 476 312, 398 310 C320 308, 266 311, 235 307 Z" fill="#fffaf0" fill-opacity="0.72"/>

  <!-- Crisp shoreline ripple lines -->
  <path d="M130 356 Q270 344 415 358 T705 352" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.6"/>
  <path d="M90 388 Q250 374 430 390 T735 384" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Tiny anchored outrigger banca near shoal edge -->
  <g transform="translate(538 242) scale(0.9)">
    <path d="M-24 4 Q0 10 26 2 L16 9 L-16 9 Z" fill="#fff8eb" stroke="#083344" stroke-width="1.4"/>
    <line x1="-18" y1="6" x2="20" y2="14" stroke="#f8fafc" stroke-width="1.3"/>
    <line x1="-22" y1="10" x2="16" y2="16" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="-7" y="-2" width="14" height="5" rx="1.5" fill="#f59e0b"/>
  </g>
</svg>
