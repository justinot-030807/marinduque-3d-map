<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Bathala Caves limestone cavern in Santa Cruz, Marinduque">
  <defs>
    <linearGradient id="caveBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102926"/>
      <stop offset="52%" stop-color="#1c3f37"/>
      <stop offset="100%" stop-color="#0b1e1b"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#fcd34d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="karstLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3e35"/>
      <stop offset="100%" stop-color="#111d1a"/>
    </linearGradient>
    <linearGradient id="karstRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24352d"/>
      <stop offset="100%" stop-color="#0d1715"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#caveBg)"/>

  <!-- Jungle skylight opening -->
  <ellipse cx="388" cy="42" rx="125" ry="44" fill="#9fe3c0" fill-opacity="0.88"/>
  <ellipse cx="388" cy="40" rx="88" ry="26" fill="#fef9c3" fill-opacity="0.92"/>

  <!-- Cathedral light shaft into cavern chamber -->
  <polygon points="300,45 475,45 620,450 205,450" fill="url(#sunBeam)"/>

  <!-- Distant cavern gallery arches & stalactite columns -->
  <path d="M165 450 L185 215 Q265 135 390 148 Q515 135 615 220 L645 450 Z" fill="#132e29" opacity="0.75"/>
  <path d="M275 450 L295 275 Q388 215 495 275 L515 450 Z" fill="#21493f" opacity="0.55"/>

  <!-- Sculpted karst cave floor & sunlit limestone shrine boulders -->
  <path d="M120 450 Q260 355 412 365 Q560 375 690 450 Z" fill="#1b302a"/>
  <path d="M265 450 Q385 372 515 450 Z" fill="#3a5244"/>
  <ellipse cx="395" cy="410" rx="108" ry="22" fill="#f59e0b" fill-opacity="0.16"/>

  <!-- Hanging limestone stalactites -->
  <path d="M210 0 L226 118 L244 0 Z" fill="#172823"/>
  <path d="M252 0 L264 78 L278 0 Z" fill="#1d322c"/>
  <path d="M510 0 L526 95 L542 0 Z" fill="#172823"/>
  <path d="M555 0 L569 132 L584 0 Z" fill="#14231e"/>

  <!-- Framing foreground karst rock walls -->
  <path d="M0 0 L245 0 Q205 125 185 225 Q165 320 225 450 L0 450 Z" fill="url(#karstLeft)"/>
  <path d="M800 0 L560 0 Q602 125 615 235 Q628 335 572 450 L800 450 Z" fill="url(#karstRight)"/>

  <!-- Lush tropical vines draped across cavern mouth -->
  <path d="M240 0 Q255 82 232 162 M268 0 Q276 62 260 120 M542 0 Q528 74 548 148" fill="none" stroke="#367a54" stroke-width="3" stroke-linecap="round"/>
  <g fill="#4ca36d" opacity="0.88">
    <ellipse cx="236" cy="96" rx="10" ry="4" transform="rotate(-24 236 96)"/>
    <ellipse cx="240" cy="134" rx="11" ry="4" transform="rotate(18 240 134)"/>
    <ellipse cx="536" cy="86" rx="10" ry="4" transform="rotate(24 536 86)"/>
    <ellipse cx="545" cy="126" rx="9" ry="4" transform="rotate(-15 545 126)"/>
  </g>
</svg>
